# 生产配置：Flink 1.19 + Kafka + Iceberg（本地验证不依赖这些）
#
# 本地验证用 streamforge/job.py 的等价实现。

job:
  name: streamforge-ingest
  parallelism: 4
  checkpoint:
    interval_ms: 60000
    mode: at-least-once
    min_pause_ms: 30000
    timeout_ms: 600000

  restart:
    strategy: fixed-delay
    attempts: 3
    delay_ms: 10000

source:
  kafka:
    bootstrap_servers: kafka:9092
    topics:
      events: order_events
      dim: dim_shop
    group_id: streamforge
    starting_offsets: committed

watermark:
  timestamp_field: ingest_time
  out_of_orderness_seconds: 300

sink:
  iceberg:
    catalog: local
    warehouse: s3a://lake/_warehouse
    table: dwd.order_events
    write:
      distribution_mode: hash
      target_file_size_bytes: 134217728
      two_phase_commit: false

state:
  ttl_hours: 0

side_output:
  late_events:
    path: s3a://lake/side/late_events
    format: jsonl

# 毒消息隔离与死信队列。
# 反序列化失败 / 未知 schema 版本 / 契约违例的消息不进主流，统一落 DLQ；
# 毒丸指纹随 checkpoint 持久化，重启重投递命中即跳过，不无限失败。
dead_letter:
  enabled: true
  topic: order_events_dlq
  format: jsonl
  # DLQ 下游不可用时的本地溢出目录，恢复后由 drain 补投。
  spill_path: s3a://lake/side/dlq_spill
  poison_ledger:
    state_backend: rocksdb
    # 毒丸台账条目保留期（天），仅用于控制状态规模，不影响隔离语义。
  retained_fields:
    - raw_payload        # 原始负载（截断也留原文），足以复现问题
    - topic
    - partition
    - offset             # 原始标识三元组
    - failure_category   # 失败类别
    - schema_version     # 版本信息
    - failed_at          # 处理时间
    - fingerprint
    - attempt

dim:
  reload_strategy: full-overwrite
