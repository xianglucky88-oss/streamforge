# 生产配置：Flink 1.19 + Kafka + Iceberg（本地验证不依赖这些）
#
# 本地验证用 streamforge/job.py 的等价实现。

job:
  name: streamforge-ingest
  parallelism: 4
  checkpoint:
    interval_ms: 60000
    mode: at-least-once
    min_pause_ms: 30000
    timeout_ms: 600000

  restart:
    strategy: fixed-delay
    attempts: 3
    delay_ms: 10000

source:
  kafka:
    bootstrap_servers: kafka:9092
    topics:
      events: order_events
      dim: dim_shop
    group_id: streamforge
    starting_offsets: committed

watermark:
  timestamp_field: ingest_time
  out_of_orderness_seconds: 300

sink:
  iceberg:
    catalog: local
    warehouse: s3a://lake/_warehouse
    table: dwd.order_events
    write:
      distribution_mode: hash
      target_file_size_bytes: 134217728
      two_phase_commit: false

state:
  ttl_hours: 0

side_output:
  late_events:
    path: s3a://lake/side/late_events
    format: jsonl

dim:
  # 版本化全量快照：每条快照带 gen，结束标记校验行数/digest 后原子启用。
  # 加载失败或校验不通过时保留旧版本继续服务。
  reload_strategy: versioned-full-snapshot
  version_state: dim-active-gen
  # 内存预算：旧版本 + 候选版本之和不得超过；超出则拒绝发布新版本。
  max_bytes: 536870912
  # 保留版本数（2 = 活动版本 + 可回退的上一版本）。
  retain_versions: 2
  # 新版本快照构建期间，旧版本继续服务；不阻塞事件处理。
  refresh_mode: background
